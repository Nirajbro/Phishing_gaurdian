<!DOCTYPE html>
<html>
<head>
    <title>Hacker Pac-Man Game</title>
    <style>
        body {
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #0f0;
            font-family: 'Courier New', monospace;
        }
        #gameBoard {
            border: 2px solid #0f0;
        }
        .game-info {
            margin: 20px;
            font-size: 20px;
        }
        #backButton {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #0f0;
            color: #000;
            border: none;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-info">SCORE: <span id="score">0</span></div>
    <canvas id="gameBoard" width="600" height="400"></canvas>
    <div class="game-info">Use ARROW KEYS to move the Hacker!</div>
    


    <script>
        const canvas = document.getElementById('gameBoard');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const backButton = document.getElementById('backButton');

        const CELL_SIZE = 20;
        let score = 0;
        let gameOver = false;

        const hacker = {
            x: CELL_SIZE * 15,
            y: CELL_SIZE * 10,
            dir: 0,
            nextDir: 0,
            speed: 5,
            radius: CELL_SIZE / 2
        };

        const firewalls = Array(4).fill().map((_, i) => ({
            x: CELL_SIZE * (5 + i * 5),
            y: CELL_SIZE * (5 + i * 3),
            dir: Math.random() * Math.PI * 2,
            speed: 3,
            radius: CELL_SIZE / 2
        }));

        let points = [];

        function initGame() {
            points = [];
            for (let y = CELL_SIZE; y < canvas.height; y += CELL_SIZE * 2) {
                for (let x = CELL_SIZE; x < canvas.width; x += CELL_SIZE * 2) {
                    if (x !== hacker.x && y !== hacker.y) {
                        points.push({ x, y });
                    }
                }
            }
        }

        function drawHacker() {
            ctx.beginPath();
            ctx.fillStyle = '#0f0';
            ctx.font = `${CELL_SIZE * 1.5}px Arial`;
            ctx.fillText('☺', hacker.x - CELL_SIZE / 2, hacker.y + CELL_SIZE / 2.5);
        }

        function drawFirewall(firewall) {
            ctx.fillStyle = '#f00';
            ctx.font = `${CELL_SIZE * 1.5}px Arial`;
            ctx.fillText('💀', firewall.x - CELL_SIZE / 2, firewall.y + CELL_SIZE / 2.5);
        }

        function drawPoints() {
            ctx.fillStyle = '#fff';
            points.forEach(point => {
                ctx.beginPath();
                ctx.arc(point.x, point.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function moveCharacter(character) {
            character.x += Math.cos(character.dir) * character.speed;
            character.y += Math.sin(character.dir) * character.speed;

            if (character.x < 0) character.x = canvas.width;
            if (character.x > canvas.width) character.x = 0;
            if (character.y < 0) character.y = canvas.height;
            if (character.y > canvas.height) character.y = 0;
        }

        function checkCollisions() {
            firewalls.forEach(firewall => {
                const dx = hacker.x - firewall.x;
                const dy = hacker.y - firewall.y;
                if (Math.sqrt(dx * dx + dy * dy) < CELL_SIZE) {
                    gameOver = true;
                    setTimeout(() => {
                        showBackToHomeButton();
                    }, 1000);
                }
            });

            points = points.filter(point => {
                const dx = point.x - hacker.x;
                const dy = point.y - hacker.y;
                if (Math.sqrt(dx * dx + dy * dy) < CELL_SIZE) {
                    score += 10;
                    scoreElement.textContent = score;
                    return false;
                }
                return true;
            });

            if (points.length === 0) {
                gameOver = true;
                setTimeout(() => {
                    alert('YOU WIN! Data secured!');
                    showBackToHomeButton();
                }, 500);
            }
        }

        function gameLoop() {
            if (gameOver) {
                ctx.fillStyle = '#f00';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('HACK FAILED!', canvas.width / 2, canvas.height / 2);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            moveCharacter(hacker);
            firewalls.forEach(firewall => {
                firewall.dir += (Math.random() - 0.5) * 0.5;
                moveCharacter(firewall);
            });

            drawPoints();
            drawHacker();
            firewalls.forEach(drawFirewall);

            checkCollisions();
            requestAnimationFrame(gameLoop);
        }

        function showBackToHomeButton() {
            backButton.style.display = 'inline-block';
        }

        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp': hacker.dir = -Math.PI / 2; break;
                case 'ArrowDown': hacker.dir = Math.PI / 2; break;
                case 'ArrowLeft': hacker.dir = Math.PI; break;
                case 'ArrowRight': hacker.dir = 0; break;
            }
        });

        initGame();
        gameLoop();
    </script>
</body>
</html>
