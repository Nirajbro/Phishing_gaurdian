<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trojan Horse Game</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      text-align: center;
      padding-top: 50px;
      background-color: #000;
      color: #0f0;
      overflow: hidden;
    }

    h1 {
      color: #0f0;
    }

    #trojanHorse {
      width: 150px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    #trojanHorse:hover {
      transform: scale(1.1);
    }

    #fakeTerminal {
      display: none;
      text-align: left;
      margin: 20px auto;
      padding: 20px;
      width: 80%;
      height: 300px;
      background-color: black;
      color: lime;
      font-size: 14px;
      border: 2px solid #0f0;
      overflow-y: auto;
      animation: flicker 0.1s infinite alternate;
    }

    #alertOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 0, 0, 0.9);
      color: white;
      font-size: 48px;
      font-weight: bold;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-shadow: 2px 2px #000;
      z-index: 9999;
      animation: flashBg 0.5s infinite;
    }

    @keyframes flashBg {
      0% { background-color: rgba(255, 0, 0, 0.9); }
      50% { background-color: rgba(0, 0, 0, 0.9); }
      100% { background-color: rgba(255, 0, 0, 0.9); }
    }

    @keyframes flicker {
      from { opacity: 1; }
      to { opacity: 0.8; }
    }

    .blinking {
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
      to {
        visibility: hidden;
      }
    }
  </style>
</head>
<body>
  <h1>Click the Mysterious Gift!</h1>
  <img id="trojanHorse" src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Trojan_Horse_as_a_gift.svg/512px-Trojan_Horse_as_a_gift.svg.png" alt="Trojan Horse">

  <div id="fakeTerminal"></div>

  <div id="alertOverlay">
    ⚠️ SYSTEM BREACH DETECTED ⚠️<br><br>
    <span class="blinking">ALL DATA COMPROMISED</span>
  </div>

  <script>
    const horse = document.getElementById('trojanHorse');
    const terminal = document.getElementById('fakeTerminal');
    const alertOverlay = document.getElementById('alertOverlay');

    const fakeLogs = [
      "[+] Accessing system files...",
      "[+] Disabling firewall...",
      "[+] Uploading credentials...",
      "[+] Dumping database...",
      "[!] ALERT: Unauthorized access detected!",
      "[+] Establishing backdoor...",
      "[+] Encrypting files...",
      "[!] SYSTEM FAILURE",
      "[!] SYSTEM BREACH INITIATED...",
      ">>> Goodbye 👾"
    ];

    horse.addEventListener('click', () => {
      horse.style.display = 'none';
      terminal.style.display = 'block';
      startFakeBreach();
    });

    function startFakeBreach() {
      let i = 0;
      const interval = setInterval(() => {
        if (i < fakeLogs.length) {
          terminal.innerHTML += fakeLogs[i] + '<br>';
          terminal.scrollTop = terminal.scrollHeight;
          i++;
        } else {
          clearInterval(interval);
          terminal.innerHTML += "<br><br><span class='blinking'>[ SYSTEM CRASHED. RESTARTING... ]</span>";
          showHackerAlert();
        }
      }, 700);
    }

    function showHackerAlert() {
      setTimeout(() => {
        alertOverlay.style.display = 'flex';
        setTimeout(() => {
          location.reload(); // Simulated restart
        }, 5000);
      }, 2000);
    }
  </script>
</body>
</html>
